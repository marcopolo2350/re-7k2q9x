<title>Rose's EATS</title>
<style>
:root{--bg:#FBF3E6;--paper:#FFFDF8;--card:#FFFFFF;--ink:#3B1D24;--mut:#8C6E70;--wine:#6E1E2F;--wine2:#8E2C42;--acc:#8E2C42;--rose:#D9788C;--rose2:#F6D9DF;--sage:#6F9172;--gold:#C9A063;--line:#EBDCCB;--shadow:0 2px 14px rgba(70,20,30,.08);--serif:"Iowan Old Style","Palatino","Georgia",serif;--script:"Snell Roundhand","Brush Script MT",cursive}
body.night{--bg:#1C1114;--paper:#271A1E;--card:#2C1D22;--ink:#F5E6DA;--mut:#BFA3A5;--acc:#E08A9C;--rose2:#4A2A33;--line:#45302F;--shadow:0 2px 14px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.42 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
.top{position:sticky;top:0;z-index:40;background:var(--wine);color:#F8E9D8;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 14px) 8px calc(env(safe-area-inset-left) + 14px);box-shadow:0 2px 12px rgba(40,5,15,.25)}
.top img{width:34px;height:34px;border-radius:9px;box-shadow:0 0 0 1px rgba(255,255,255,.2)}
.brand{font-family:var(--serif);font-weight:700;letter-spacing:.04em;font-size:19px;line-height:1}
.brand small{display:block;font:600 9.5px/1.4 -apple-system,sans-serif;letter-spacing:.18em;opacity:.75;text-transform:uppercase}
.top .sp{flex:1}
.ibtn{background:rgba(255,255,255,.12);border:0;color:#F8E9D8;border-radius:12px;height:36px;min-width:36px;padding:0 10px;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.ibtn b{background:var(--rose);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px}
main{max-width:1000px;margin:0 auto;padding:16px calc(env(safe-area-inset-right) + 16px) calc(100px + env(safe-area-inset-bottom)) calc(env(safe-area-inset-left) + 16px)}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px calc(env(safe-area-inset-right) + 4px) calc(6px + env(safe-area-inset-bottom)) calc(env(safe-area-inset-left) + 4px)}
.tabs button{flex:1;max-width:120px;background:none;border:0;font-size:10.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 0;position:relative}
.tabs .i{font-size:22px;filter:grayscale(.7);opacity:.65;transition:transform .2s}
.tabs button.on{color:var(--acc);font-weight:700}
.tabs button.on .i{filter:none;opacity:1;transform:translateY(-2px) scale(1.12)}
.tabs .bd{position:absolute;top:0;left:calc(50% + 6px);background:var(--rose);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:0 5px;line-height:16px}
h1.h1{font-family:var(--serif);font-size:28px;margin:4px 0 12px;color:var(--wine)}
body.night h1.h1{color:#F0C6CF}
.h2{font-family:var(--serif);font-size:20px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.cnt{font:700 12px -apple-system,sans-serif;background:var(--rose2);color:var(--acc);border-radius:20px;padding:2px 9px}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:8px}.sb{justify-content:space-between}.wrap{flex-wrap:wrap}.g8{gap:8px;margin-top:10px}
.mut{color:var(--mut)}.small{font-size:13px}.center{text-align:center}.pad{padding:6px 2px}
.btn{border:0;border-radius:14px;padding:11px 16px;background:var(--wine);color:#FBEFE3;font-weight:650;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 2px 8px rgba(110,30,47,.2)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.rose{background:var(--rose);color:#fff}
.btn.sage{background:var(--sage);color:#fff}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:12px}
.btn.full{width:100%}.btn.big{padding:15px;font-size:16px}
.btn[disabled]{opacity:.4}
.link{background:none;border:0;color:var(--acc);font-weight:650;padding:4px 0;font-size:14px}
.search,.inp,select.inp,textarea.inp{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.search:focus,.inp:focus{border-color:var(--rose)}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--paper);border-radius:20px;padding:7px 13px;font-size:13.5px;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--wine);border-color:var(--wine);color:#FBEFE3;font-weight:650}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px;margin-top:12px}
.rc{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);position:relative;border:1px solid var(--line);display:flex;flex-direction:column}
.rc .art{aspect-ratio:4/3}
.rc .meta{padding:9px 11px 10px;display:flex;flex-direction:column;gap:3px;flex:1}
.rc .rn{font-family:var(--serif);font-weight:700;font-size:15.5px;line-height:1.2}
.rc .rm{font-size:11.5px;color:var(--mut)}
.rc .ra{display:flex;gap:6px;margin-top:auto;padding-top:6px}
.rc .ra button{flex:1;border:0;border-radius:10px;padding:7px 0;font-size:12.5px;font-weight:650;background:var(--rose2);color:var(--acc)}
.rc .ra button.on{background:var(--sage);color:#fff}
.hrt{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,253,248,.9);font-size:17px;color:#B23A48;box-shadow:0 2px 6px rgba(0,0,0,.15);z-index:2}
.tag{position:absolute;top:8px;left:8px;z-index:2;background:rgba(59,29,36,.78);color:#fff;font-size:10.5px;font-weight:700;border-radius:10px;padding:3px 8px}
.ck-tag{position:absolute;top:46px;right:8px;z-index:2;background:var(--sage);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:2px 7px}
.more{display:block;margin:16px auto}
/* food art */
.photo{position:relative;overflow:hidden;background:#4a2a1e}
.photo>i{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(var(--z,1.04));transform-origin:var(--ox,50%) var(--oy,50%)}
.mini.photo{display:block}

.art{position:relative;overflow:hidden;container-type:size;background:radial-gradient(circle at 25% 15%,rgba(255,255,255,.4),transparent 45%),linear-gradient(140deg,var(--g1),var(--g2))}
.art::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 12px,transparent 12px 24px),repeating-linear-gradient(-45deg,rgba(255,255,255,.07) 0 12px,transparent 12px 24px)}
.plate{position:absolute;left:50%;top:53%;width:70cqmin;height:70cqmin;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle closest-side,#fff 0 70%,#efe6dd 72% 78%,#fffdf9 80% 93%,#e2d3c4 95% 100%);box-shadow:0 5cqmin 9cqmin -3cqmin rgba(40,10,10,.45)}
.mainE{position:absolute;left:50%;top:53%;transform:translate(-50%,-50%);font-size:34cqmin;line-height:1;filter:drop-shadow(0 2cqmin 2cqmin rgba(0,0,0,.25))}
.gn{position:absolute;transform:translate(-50%,-50%) rotate(var(--r));font-size:14cqmin;line-height:1;filter:drop-shadow(0 1cqmin 1.5cqmin rgba(0,0,0,.25))}
.fork{position:absolute;left:8%;top:53%;transform:translate(-50%,-50%) rotate(-8deg);font-size:15cqmin;opacity:.85}
/* home */
.hero{background:radial-gradient(circle at 80% 0%,#9B3450,transparent 55%),linear-gradient(160deg,#7A2338,#5A1626);color:#F8E9D8;border-radius:26px;padding:22px 18px 18px;text-align:center;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(90,22,38,.35)}
.hero::after{content:"";position:absolute;inset:8px;border:1.5px solid rgba(232,196,140,.45);border-radius:20px;pointer-events:none}
.hero img{width:96px;height:96px;border-radius:24px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.hero .tl{font:600 12px -apple-system;letter-spacing:.2em;text-transform:uppercase;color:#E8C48C;margin-top:10px}
.joke{perspective:900px;margin:16px auto 6px;height:138px;max-width:460px;cursor:pointer}
.jin{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.3,1.35,.5,1);transform-style:preserve-3d}
.joke.flip .jin{transform:rotateX(180deg)}
.jf,.jb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center}
.jf{background:#FBF3E6;color:#3B1D24}
.jb{background:linear-gradient(135deg,#D9788C,#B23A48);color:#fff;transform:rotateX(180deg)}
.jq{font:700 22px/1.2 var(--serif)}
.jh{font-size:12.5px;color:#8C6E70;margin-top:6px}
.ja{font:700 44px/1 var(--script)}
.js{font-size:12.5px;margin-top:8px;opacity:.95}
.hbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;position:relative;z-index:1}
.hbtns .btn{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);color:#FBEFE3;font-size:13.5px;padding:11px 8px}
.hbtns .btn.gold{background:#E8C48C;color:#5A1626;grid-column:1/-1;font-size:16px;padding:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font:700 22px var(--serif);color:var(--acc)}
.stat span{font-size:10.5px;color:var(--mut);line-height:1.1;display:block}
.meter{height:14px;border-radius:10px;background:linear-gradient(90deg,#9CC9A0,#F1D27A,#F0965B,#B23A48);position:relative;margin:12px 0 6px}
.needle{position:absolute;top:-6px;width:5px;height:26px;background:var(--ink);border-radius:3px;animation:wig .45s ease-in-out infinite alternate}
@keyframes wig{from{left:93%}to{left:99%}}
.mlabels{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut);font-weight:600}
.live{color:#B23A48;font-size:11px;font-weight:800;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}
.strip{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.strip .rc{flex:0 0 150px}
.rule{font:italic 17px/1.35 var(--serif);margin-top:4px}
.howto ol{margin:6px 0 0;padding-left:20px}.howto li{margin:4px 0}
.spinbox{display:flex;align-items:center;gap:12px}
.spinbox.rolling{filter:blur(.4px)}
/* planner */
.weeknav{display:flex;align-items:center;gap:6px}
.weeknav .wl{flex:1;text-align:center;font-weight:700;font-family:var(--serif);font-size:16px}
.day.today{border-color:var(--rose);box-shadow:0 0 0 2px var(--rose2),var(--shadow)}
.dn{font:700 17px var(--serif)}.dn small{font:500 12px -apple-system;color:var(--mut);margin-left:6px}
.pill{background:var(--rose);color:#fff;font:700 10.5px -apple-system;border-radius:10px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.pe{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px dashed var(--line)}
.pe:first-of-type{border-top:0}
.mini{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:linear-gradient(140deg,var(--g1),var(--g2))}
.mini.lg{width:54px;height:54px;font-size:30px;border-radius:14px}
.pn{flex:1;min-width:0;font-weight:650;font-size:14.5px;line-height:1.2}
.pn small{display:block;font-weight:500;color:var(--mut);font-size:12px;margin-top:2px}
.mt{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:7px;padding:1px 6px;margin-right:4px;background:var(--rose2);color:var(--acc)}
.x{border:0;background:var(--rose2);color:var(--acc);width:32px;height:32px;border-radius:50%;font-size:14px;flex:none}
.stepper{display:inline-flex;align-items:center;background:var(--rose2);border-radius:12px;overflow:hidden}
.stepper button{border:0;background:none;width:34px;height:34px;font-size:18px;color:var(--acc);font-weight:700}
.stepper span{min-width:28px;text-align:center;font-weight:700;font-size:14px}
/* groceries */
.bar{height:8px;background:var(--rose2);border-radius:6px;overflow:hidden;margin:8px 0 2px}.bar>div{height:100%;background:linear-gradient(90deg,var(--rose),var(--wine2));border-radius:6px;transition:width .3s}
.gsec{background:var(--card);border-radius:18px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.gsh{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;font-weight:750;font-size:14.5px;background:var(--paper);border-bottom:1px solid var(--line)}
.gsh span{font-size:12px;color:var(--mut);font-weight:600}
details.gsec summary{list-style:none;cursor:pointer}details.gsec summary::-webkit-details-marker{display:none}
.gi{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.gi:first-of-type{border-top:0}
.cb{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--rose);display:grid;place-items:center;color:#fff;font-size:14px;font-weight:900;margin-top:1px}
.gi.done .cb{background:var(--sage);border-color:var(--sage)}
.gi.done .gt{text-decoration:line-through;opacity:.5}
.gt{flex:1;min-width:0}
.gt b{font-weight:650}.amt{color:var(--acc);font-weight:650;font-size:14px}
.gt small{display:block;color:var(--mut);font-size:11.5px;margin-top:1px}
.addf{display:flex;gap:8px;margin:4px 0 12px}
.srcs .pe{padding:7px 0}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-size:14.5px}
.sw{position:relative;width:50px;height:30px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:20px;transition:.2s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.sw input:checked+span{background:var(--sage)}
.sw input:checked+span::after{transform:translateX(20px)}
/* pantry */
.seg{display:flex;background:var(--rose2);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:10px 4px;font-weight:650;font-size:14px;color:var(--acc)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.kstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kchips{display:flex;flex-wrap:wrap;gap:7px;padding:12px 14px}
.kc{border:1.5px solid var(--line);background:var(--paper);border-radius:18px;padding:7px 12px;font-size:13.5px;color:var(--ink)}
.kc.on{background:var(--sage);border-color:var(--sage);color:#fff;font-weight:650}
.mk-top{display:flex;align-items:center;gap:12px;cursor:pointer}
.need{margin-top:8px;font-size:13px;color:var(--mut)}
.nchip{display:inline-block;background:var(--rose2);color:var(--acc);border-radius:10px;padding:2px 8px;margin:3px 4px 0 0;font-weight:650;font-size:12.5px}
input[type=range]{width:100%;accent-color:var(--wine2);margin:10px 0 2px}
.empty{background:var(--paper);border:1.5px dashed var(--line);border-radius:16px;padding:16px;text-align:center;color:var(--mut);font-size:14px;margin-bottom:12px}
.empty.big{padding:28px 16px;font-size:15px}.empty.big .e{font-size:44px}
/* sheet */
.shw{position:fixed;inset:0;z-index:200;display:none}
.shw.open{display:block}
.shbg{position:absolute;inset:0;background:rgba(30,8,14,.5);animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:720px;max-height:92%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:24px 24px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1);overscroll-behavior:contain}
@media (min-width:760px) and (min-height:600px){.sheet{bottom:auto;top:50%;transform:translateY(-50%);border-radius:24px;max-height:88%;animation:fade .2s}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.7);position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:3}
.sx{position:sticky;top:10px;float:right;margin:10px 12px -46px 0;z-index:5;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,253,248,.92);font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,.2);color:#3B1D24}
.d-art .art{height:min(34vh,260px);border-radius:24px 24px 0 0}
.d-body{padding:16px 18px}
.d-cat{font:800 11.5px -apple-system;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.d-t{font:700 26px/1.15 var(--serif);margin:4px 0 8px}
.d-desc{font:italic 16px/1.45 var(--serif);color:var(--mut);margin:0 0 12px}
.d-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.d-meta span{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:4px 9px;font-size:12.5px;font-weight:600}
.d-acts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.d-acts .btn{padding:10px 4px;font-size:13px}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.daypick button{border:0;background:var(--rose2);color:var(--acc);border-radius:10px;padding:9px 0;font-weight:700;font-size:12.5px}
.daypick button small{display:block;font-weight:500;font-size:10px}
.mtpick{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.mtpick button{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 0;font-size:12.5px;font-weight:650}
.mtpick button.on{background:var(--wine);color:#fff;border-color:var(--wine)}
.tt{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 0 4px;padding:12px;border-radius:14px;background:#111;color:#fff;text-decoration:none;font-weight:700;font-size:15px}
.tt small{font-weight:500;opacity:.7;font-size:12px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:18px 0 6px}
.sec-h h3,.d-body h3{font:700 19px var(--serif);margin:0}
.d-body h3{margin:18px 0 8px}
.ings{list-style:none;margin:0;padding:0}
.ings li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.ings li .q{flex:1}
.have-b{border:0;border-radius:10px;padding:5px 9px;font-size:12px;font-weight:700;background:var(--rose2);color:var(--acc);flex:none}
.have-b.on{background:var(--sage);color:#fff}
.steps{margin:0;padding-left:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:0 0 12px 40px;font-size:15.5px}
.steps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:28px;height:28px;border-radius:50%;background:var(--wine);color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center}
.allhave{background:#E6F1E4;color:#2F6B3A;border-radius:12px;padding:10px;text-align:center;font-weight:700;margin-top:10px}
body.night .allhave{background:#24402A;color:#BFE3C3}
.rating{display:flex;gap:4px;flex-wrap:wrap}
.rating button{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);font-weight:700;font-size:13px}
.rating button.on{background:var(--rose);border-color:var(--rose);color:#fff}
.prow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:7px}
.prow.sel{border-color:var(--wine);box-shadow:0 0 0 2px var(--rose2)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:#3B1D24;color:#FBEFE3;padding:11px 18px;border-radius:16px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:500;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.cf{position:fixed;top:-40px;z-index:450;pointer-events:none;animation:fall 2.3s cubic-bezier(.3,.6,.6,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),112vh) rotate(560deg)}}
.closedbook{margin:6px auto 16px;width:min(300px,78vw);aspect-ratio:3/4;border-radius:6px 16px 16px 6px;background:radial-gradient(circle at 30% 20%,#9B3450,#5A1626 75%);box-shadow:inset 12px 0 18px rgba(0,0,0,.35),0 16px 30px rgba(60,10,20,.35),8px 6px 0 -2px #EFE3CF,9px 8px 0 -2px #D9CBB3;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#E8C48C;text-align:center;padding:24px;cursor:pointer;position:relative;transition:transform .3s}
.closedbook:active{transform:rotateY(-12deg) scale(.98)}
.closedbook::before{content:"";position:absolute;inset:14px 14px 14px 22px;border:1.5px solid rgba(232,196,140,.6);border-radius:4px 10px 10px 4px}
.closedbook img{width:92px;height:92px;border-radius:50%;margin-bottom:12px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.cbt{font:700 30px/1 var(--serif);letter-spacing:.06em;color:#F8E9D8}
.cbs{font:600 11px -apple-system;letter-spacing:.24em;margin-top:8px;text-transform:uppercase}
.cbq{font:italic 14px var(--serif);margin-top:16px;color:#F3D9B0}
/* BOOK */
#book{position:fixed;inset:0;z-index:150;display:none;background:radial-gradient(ellipse at 50% 35%,#6A4130,#2A1712 75%);color:#F3E3CF}
#book.open{display:block}
.bk-bar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 10px) 6px calc(env(safe-area-inset-left) + 10px);z-index:5}
.bk-bar .ibtn{height:34px}
.bk-bar select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#F3E3CF;border-radius:10px;height:34px;padding:0 8px;font-size:13px;max-width:36vw;min-width:0}
.bk-bar select option{color:#000}.bk-bar .sp{flex:1}
#bkCnt{font:600 12px -apple-system;opacity:.85;min-width:56px;text-align:center}
.stage{position:absolute;left:calc(env(safe-area-inset-left) + 44px);right:calc(env(safe-area-inset-right) + 44px);top:calc(env(safe-area-inset-top) + 48px);bottom:calc(env(safe-area-inset-bottom) + 10px);display:flex;align-items:center;justify-content:center}
#book.port .stage{left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 64px)}
.fb{margin:0 auto;filter:drop-shadow(0 18px 26px rgba(0,0,0,.45))}
.bpg{background:#FBF5EA;color:#3A2420;overflow:hidden}
.bpg .pi{position:absolute;inset:0;display:flex;flex-direction:column}
.bpg.L .pi{background:linear-gradient(to left,rgba(70,40,20,.28),rgba(70,40,20,0) 7%),radial-gradient(circle at 20% 10%,#FFFCF5,#F3E9D7)}
.bpg.R .pi{background:linear-gradient(to right,rgba(70,40,20,.28),rgba(70,40,20,0) 7%),radial-gradient(circle at 80% 10%,#FFFCF5,#F3E9D7)}
#book.port .bpg .pi{background:radial-gradient(circle at 50% 0%,#FFFCF5,#F3E9D7)}
.bphoto{position:absolute;inset:10px;border-radius:6px;overflow:hidden;box-shadow:0 0 0 4px #fff,0 4px 14px rgba(60,30,10,.3)}
.bpg.L .bphoto{right:16px}.bpg.R .bphoto{left:16px}
#book.port .bphoto{left:10px;right:10px}
.bphoto .photo{position:absolute;inset:0}

.tbtns{display:flex;gap:4px}.tbtns button{border:0;background:var(--rose2);color:var(--acc);border-radius:10px;min-width:40px;height:40px;font-weight:700;font-size:15px}
.iosnote{background:#FFF6E0;margin-top:12px}body.night .iosnote{background:#3A2C18}
.mrow{border-top:1px solid var(--line);padding:10px 0}.mrow .mc{font:800 11px -apple-system;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}.mrow.off{display:flex;justify-content:space-between;align-items:center}
.tlrow{display:flex;gap:10px;border-bottom:1px solid var(--line);padding:9px 0}.tlrow .cb{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--paper);font-weight:800;color:#fff}.tlrow.done .cb{background:var(--sage);border-color:var(--sage)}.tlrow.done{opacity:.55}
.resume{background:var(--rose2)}
.ck-top .ck-t{font-size:15px;line-height:1.2;overflow:hidden}.ck-top .ck-t small{display:block;font-size:11px}
.tech{border:0;background:none;padding:0;color:inherit;font:inherit;text-decoration:underline dotted var(--acc);text-underline-offset:3px;cursor:help}
#techPop{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.35);align-items:flex-end;justify-content:center}#techPop.on{display:flex}#techPop .tp-in{background:var(--card);color:var(--ink);border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-width:560px;width:100%}
.khist{background:#FFF6E0}body.night .khist{background:#3A2C18}.khist p{margin:6px 0}.hph img{width:90px;height:68px;object-fit:cover;border-radius:8px;margin:4px 4px 0 0}
.hf label{display:block;font-size:13px;color:var(--mut);margin:8px 0 2px}.stars{display:flex;gap:4px}.star{border:0;background:none;font-size:30px;color:#D9CBB8;min-width:44px;min-height:44px}.star.on{color:#C9A063}
.verbar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}.verinfo{background:var(--rose2)}
.rec .why{margin:6px 0}.dash{margin:0 0 8px}.dash-q{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.dash .stat{cursor:pointer}
.invrow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}.invrow .pn{flex:1;border:0;background:none;text-align:left;padding:10px 2px;color:var(--ink);display:flex;flex-direction:column}.invrow small{color:var(--mut)}
.eqn{margin:6px 0}.var{border-top:1px solid var(--line);padding:6px 0}.var ul{margin:4px 0;padding-left:18px}
table.nut{width:100%;border-collapse:collapse}table.nut td{padding:4px 0;border-bottom:1px solid var(--line)}table.nut td:last-child{text-align:right;font-weight:650}
.risk{border-radius:14px;padding:10px 12px;margin:10px 0;border:1.5px solid}.risk p{margin:4px 0}.risk.checked{background:#E3F0E3;border-color:#6F9172}.risk.guidance{background:#FFF1D6;border-color:#C9A063}.risk.flagged{background:#FCE0DA;border-color:#C0533A}
body.night .risk.checked{background:#22382A}body.night .risk.guidance{background:#3A2C18}body.night .risk.flagged{background:#4A2219}
.qt{min-height:64px}.phgrid{display:flex;flex-wrap:wrap;gap:6px}.phgrid div{position:relative}.phgrid img{width:84px;height:64px;object-fit:cover;border-radius:8px}.phgrid .x{position:absolute;top:2px;right:2px;width:26px;height:26px}.lofm{flex-wrap:wrap}.lf{font-size:13px;font-weight:600}.lf.bad{color:#A33A1F}.lf.warn{color:#9A5A12}.lf.ok{color:#2F5A33}.chip,.kc,.btn.sm{min-height:36px}
</style>
